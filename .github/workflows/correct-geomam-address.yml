name: Correct TGU Geomam-dong address
on:
  push:
    branches: [main]
    paths: ['.github/workflows/correct-geomam-address.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tga-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: ': > "$RUNNER_TEMP/address-update.b64"'
      - name: Read address update 1
        run: printf '%s' '' >> "$RUNNER_TEMP/address-update.b64"
      - name: Read address update 2
        run: printf '%s' '' >> "$RUNNER_TEMP/address-update.b64"
      - name: Read address update 3
        run: printf '%s' '' >> "$RUNNER_TEMP/address-update.b64"
      - name: Apply corrected public address
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$RUNNER_TEMP/address-update.b64" > "$RUNNER_TEMP/address-update.zip"
          unzip -oq "$RUNNER_TEMP/address-update.zip" -d .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- *.html js/i18n-ko.js
          if ! git diff --cached --quiet; then
            git commit -m 'Correct neighborhood to Geomam-dong in all public addresses and map'
            git push origin HEAD:main
          fi
          mkdir -p _site
          cp -- *.html _site/
          cp -R css js images _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
