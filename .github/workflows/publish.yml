name: Publish TGA website
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tga-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore approved TGA website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/images
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/tga.zip"
          unzip -oq "$RUNNER_TEMP/tga.zip" -d _site
          for asset in hero-home.jpg logo.png person-admin.jpg person-dean.jpg person-vp.jpg photo-01.jpg photo-02.jpg photo-03.jpg photo-04.jpg photo-05.jpg photo-06.jpg photo-07.jpg photo-08.jpg photo-09.jpg photo-10.jpg photo-11.jpg photo-12.jpg photo-13.jpg photo-14.jpg photo-15.jpg photo-16.jpg photo-17.jpg photo-18.jpg photo-19.jpg photo-20.jpg photo-21.jpg photo-22.jpg photo-23.jpg photo-24.jpg photo-25.jpg photo-26.jpg photo-27.jpg photo-28.jpg photo-29.jpg photo-30.jpg president.jpg; do
            curl --fail --silent --show-error --location --retry 3 "https://baekhyung8523-cloud.github.io/gtu-university/images/$asset" -o "_site/images/$asset"
          done
          touch _site/.nojekyll
      - name: Save complete portable source to repository
        shell: bash
        run: |
          set -euo pipefail
          cp _site/*.html .
          cp -R _site/css _site/js _site/images .
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- *.html css js images .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Publish approved TGA website source and images'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
