name: Refine TGU vice-president portrait
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refine-portrait.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tga-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize portrait update
        run: ': > "$RUNNER_TEMP/portrait-update.b64"'
      - name: Read portrait update 1
        run: printf '%s' '' >> "$RUNNER_TEMP/portrait-update.b64"
      - name: Read portrait update 2
        run: printf '%s' '' >> "$RUNNER_TEMP/portrait-update.b64"
      - name: Read portrait update 3
        run: printf '%s' '' >> "$RUNNER_TEMP/portrait-update.b64"
      - name: Read portrait update 4
        run: printf '%s' '' >> "$RUNNER_TEMP/portrait-update.b64"
      - name: Read portrait update 5
        run: printf '%s' '' >> "$RUNNER_TEMP/portrait-update.b64"
      - name: Read portrait update 6
        run: printf '%s' '' >> "$RUNNER_TEMP/portrait-update.b64"
      - name: Read portrait update 7
        run: printf '%s' '' >> "$RUNNER_TEMP/portrait-update.b64"
      - name: Read portrait update 8
        run: printf '%s' '' >> "$RUNNER_TEMP/portrait-update.b64"
      - name: Read portrait update 9
        run: printf '%s' '' >> "$RUNNER_TEMP/portrait-update.b64"
      - name: Apply approved portrait and layout
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$RUNNER_TEMP/portrait-update.b64" > "$RUNNER_TEMP/portrait-update.zip"
          unzip -oq "$RUNNER_TEMP/portrait-update.zip" -d .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- about.html css/style.css images/vice-president-lim-clean.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Use clean 4x5 vice-president portrait and consistent card layout'
            git push origin HEAD:main
          fi
          mkdir -p _site
          cp -- *.html _site/
          cp -R css js images _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
