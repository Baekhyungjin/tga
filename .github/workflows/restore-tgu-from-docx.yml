name: Apply approved TGU document corrections
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-tgu-from-docx.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tga-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize approved update
        run: ': > "$RUNNER_TEMP/tgu-update.b64"'
      - name: Read approved update 1 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 2 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 3 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 4 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 5 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 6 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 7 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 8 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 9 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 10 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 11 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 12 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 13 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 14 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 15 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 16 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 17 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 18 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 19 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 20 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 21 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 22 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 23 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Read approved update 24 of 24
        shell: bash
        run: printf '%s' '' >> "$RUNNER_TEMP/tgu-update.b64"
      - name: Apply and save approved website files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$RUNNER_TEMP/tgu-update.b64" > "$RUNNER_TEMP/tgu-update.zip"
          unzip -oq "$RUNNER_TEMP/tgu-update.zip" -d .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- *.html css js images
          if ! git diff --cached --quiet; then
            git commit -m 'Apply requested TGU name, history, photographs and admission choices'
            git push origin HEAD:main
          fi
          mkdir -p _site
          cp -- *.html _site/
          cp -R css js images _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish corrected website
        id: deployment
        uses: actions/deploy-pages@v4
